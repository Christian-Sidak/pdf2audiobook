version: 1
defaults:
  pass_k: 3
  wer_threshold: 0.10
  sec_per_char: {min: 0.045, max: 0.14}
  silence_tolerance_ms: 150
  lufs_target: -18.0
  lufs_tolerance: 1.5
  true_peak_max: -3.0
  dict_word_ratio_min: 0.85
  garbage_char_density_max: 0.02
  header_page_fraction: 0.2
  faithfulness_min_similarity: 75   # partial_ratio since 2026-09-05 (was token_set_ratio at 60)
  hallucination_min_similarity: 60  # reverse check keeps token_set_ratio
  faithfulness_min_words: 8
  chapter_text_coverage_min: 0.97

  wer_sample: 200
documents:
- id: man_eating_lions_of_tsavo_patterson_1925
  pdf: library/Man-Eating Lions of Tsavo (Patterson, 1925).pdf
  kind: book
  language: en
  tier: full
  golden:
    body_text: evals/golden/man_eating_lions_of_tsavo_patterson_1925/body.txt
    chapters: evals/golden/man_eating_lions_of_tsavo_patterson_1925/chapters.json
  expect:
    chapter_count: 1
    has_embedded_toc: false
    ocr_expected_pages: []
  assertions:
    must_contain:
    - id: span_roosevelt
      text: 'A late great President of the United States, that man with the wonderful personality—Theodore
        Roosevelt—has put it on record that "the story of the ManEaters of Tsavo is by far the most remarkable
        account of which we have any record ;" while that veteran big game hunter and African pioneer,
        Selous, '
      note: PD text (1925 Field Museum leaflet); source 
        https://archive.org/details/maneatinglionsof07patt
- id: arxiv_2201_00650
  pdf: "library/2201.00650.pdf"
  kind: book
  language: en
  tier: smoke
  expect:
    chapter_count:
    has_embedded_toc: true
    ocr_expected_pages: []
    body_dict_word_ratio_min: 0.65
  assertions:
    must_contain: []
    must_not_contain: []
    keep_hyphens: []
    deletion_allowlist: []
  skip_checks:
  - no_footnotes_inline
  - paragraph_reflow
  - removed_text_absent   # example prompt boxes are duplicated in the paper body; smoke doc
  - punctuation_spacing   # artifacts predate the spacing repair; corpus id != build id, cannot rebuild in place

- id: joothan_valmiki_mukherjee_trans_2003
  pdf: library/Joothan (Valmiki, Mukherjee trans 2003).pdf
  kind: book
  language: en
  tier: smoke
  # Copyrighted (Columbia UP 2003): PDF untracked, private use; seeded
  # strings are short quotes. Exercises: indent-only paragraphs, a blank
  # page before a chapter, a family-tree diagram page (13), small-font
  # footnotes, missing spaces after punctuation.
  expect:
    chapter_count: 4        # body chapters: Foreword, Preface, Introduction, Joothan
    has_embedded_toc: false
    ocr_expected_pages: []
  assertions:
    must_contain:
    - id: intro_opens_in_intro
      text: "is among the first texts in Hindi"
      note: Introduction's first sentence; was glued onto the Preface by cross-page re-flow
    - id: narrative_opens
      text: "Our house was next to Chandrabhan"
    must_not_contain:
    - id: family_tree_label
      text: "Zaharia Great-grandfather"
      note: page 13 family-tree diagram, not prose
    - id: family_tree_marriages
      text: "Rahti Devi\nBimla Devi"
      note: diagram labels
    - id: footnote_10
      text: "The baithak was out of bounds to women"
      note: small-font footnote on page 60
    keep_hyphens: []
    deletion_allowlist: []
  skip_checks: []

- id: trial_of_joan_of_arc
  pdf: "library/Trial-of-Joan-of-Arc.pdf"
  kind: scan
  language: en
  tier: smoke
  expect:
    chapter_count:
    has_embedded_toc: false
    ocr_expected_pages: scan
    body_dict_word_ratio_min: 0.65
    wer_sample: 0
  assertions:
    must_contain: []
    must_not_contain: []
    keep_hyphens: []
    deletion_allowlist: []
  skip_checks:
  - number_style

